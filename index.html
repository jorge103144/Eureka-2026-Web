<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WATAK - NEXUS | Control Keypad IoT</title>
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
    <style>
        :root {
            --bg: #0b1120;
            --card: #1e293b;
            --text: #f8fafc;
            --muted: #94a3b8;
            --green: #10b981;
            --red: #ef4444;
            --yellow: #f59e0b;
            --blue: #3b82f6;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', system-ui, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 16px;
        }
        .panel {
            background: var(--card);
            padding: 25px;
            border-radius: 18px;
            box-shadow: 0 12px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 460px;
            border: 1px solid #334155;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #334155;
            padding-bottom: 15px;
            margin-bottom: 18px;
        }
        .title-group h1 { font-size: 1.25rem; margin: 0; color: #38bdf8; }
        .title-group small { color: var(--muted); font-size: 0.78rem; }
        .badge {
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-weight: bold;
        }
        .badge.online { background: rgba(16, 185, 129, 0.2); color: var(--green); }
        .badge.offline { background: rgba(239, 68, 68, 0.2); color: var(--red); }

        .status-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }
        .status-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            border-left: 4px solid var(--muted);
        }
        .status-box span.label { display: block; color: var(--muted); font-size: 0.75rem; margin-bottom: 4px; }
        .status-box span.value { font-weight: bold; font-size: 0.95rem; }

        .pin-box {
            background: #0f172a;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: flex;
            gap: 8px;
        }
        .pin-box input {
            flex: 1;
            background: #1e293b;
            border: 1px solid #334155;
            color: white;
            padding: 10px;
            border-radius: 8px;
            font-size: 1rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            text-align: center;
        }
        .pin-box button { background: #8b5cf6; padding: 10px 15px; }

        .section-title {
            font-size: 0.78rem;
            text-transform: uppercase;
            color: var(--muted);
            margin: 12px 0 6px 0;
        }
        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        button {
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            color: white;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.97); }
        button:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-armar { background: var(--green); }
        .btn-desarmar { background: var(--red); }
        .btn-abrir { background: #0ea5e9; }
        .btn-cerrar { background: #6366f1; }
        .log {
            margin-top: 15px;
            font-size: 0.72rem;
            color: var(--muted);
            background: #0f172a;
            padding: 8px;
            border-radius: 8px;
            height: 60px;
            overflow-y: auto;
            font-family: monospace;
        }
    </style>
</head>
<body>

<div class="panel">
    <header>
        <div class="title-group">
            <h1>🔐 WATAK - NEXUS</h1>
            <small>Prototipo 3 • Control de Acceso Keypad IoT</small>
        </div>
        <span id="connStatus" class="badge offline">Desconectado</span>
    </header>

    <div class="status-grid">
        <div class="status-box" id="boxArmado">
            <span class="label">Estado Sistema</span>
            <span class="value" id="valArmado">---</span>
        </div>
        <div class="status-box" id="boxAlarma">
            <span class="label">Seguridad / PIN</span>
            <span class="value" id="valAlarma">---</span>
        </div>
        <div class="status-box" id="boxServo">
            <span class="label">Cerradura (Servo)</span>
            <span class="value" id="valServo">---</span>
        </div>
        <div class="status-box" id="boxFallos">
            <span class="label">Intentos Fallidos</span>
            <span class="value" id="valFallos">0</span>
        </div>
    </div>

    <div class="section-title">Cambiar Clave de Acceso (4 Teclas: 0-9, A-D)</div>
    <div class="pin-box">
        <input type="text" id="nuevoPin" maxlength="4" placeholder="A4B9">
        <button onclick="cambiarPin()" disabled>💾 GUARDAR PIN</button>
    </div>

    <div class="section-title">Modo del Sistema</div>
    <div class="controls">
        <button class="btn-armar" onclick="enviarComando('armar')" disabled>🔒 ARMAR</button>
        <button class="btn-desarmar" onclick="enviarComando('desarmar')" disabled>🔓 APAGAR</button>
    </div>

    <div class="section-title">Apertura Remota</div>
    <div class="controls">
        <button class="btn-abrir" onclick="enviarComando('abrir_puerta')" disabled>🔑 ABRIR (10s)</button>
        <button class="btn-cerrar" onclick="enviarComando('cerrar_puerta')" disabled>🚪 BLOQUEAR</button>
    </div>

    <div class="log" id="logBox">Conectando al broker MQTT...</div>
</div>

<script>
    const BROKER_URL   = 'wss://broker.emqx.io:8084/mqtt';
    const TOPIC_CMD    = 'watak_nexus_erick2026/comando';
    const TOPIC_ESTADO = 'watak_nexus_erick2026/estado';

    const clientId = 'web_kp_' + Math.random().toString(16).substr(2, 8);
    const client = mqtt.connect(BROKER_URL, { clientId });

    const connStatus = document.getElementById('connStatus');
    const logBox = document.getElementById('logBox');
    const botones = document.querySelectorAll('button');

    function agregarLog(msg) {
        const hora = new Date().toLocaleTimeString();
        logBox.innerHTML = `[${hora}] ${msg}<br>` + logBox.innerHTML;
    }

    client.on('connect', () => {
        connStatus.textContent = 'En Línea';
        connStatus.className = 'badge online';
        botones.forEach(b => b.disabled = false);
        agregarLog('Conectado a WATAK-NEXUS Keypad');

        client.subscribe(TOPIC_ESTADO, (err) => {
            if (!err) enviarComando('estado');
        });
    });

    client.on('message', (topic, message) => {
        if (topic === TOPIC_ESTADO) {
            try {
                const data = JSON.parse(message.toString());
                actualizarInterfaz(data);
            } catch (e) {}
        }
    });

    client.on('offline', () => {
        connStatus.textContent = 'Desconectado';
        connStatus.className = 'badge offline';
        botones.forEach(b => b.disabled = true);
    });

    function actualizarInterfaz(data) {
        const valArmado = document.getElementById('valArmado');
        const boxArmado = document.getElementById('boxArmado');
        valArmado.textContent = data.armado ? 'ARMADO' : 'APAGADO';
        valArmado.style.color = data.armado ? 'var(--green)' : 'var(--muted)';
        boxArmado.style.borderLeftColor = data.armado ? 'var(--green)' : 'var(--muted)';

        const valAlarma = document.getElementById('valAlarma');
        const boxAlarma = document.getElementById('boxAlarma');
        if (data.alarma) {
            valAlarma.textContent = '¡PIN ERRÓNEO!';
            valAlarma.style.color = 'var(--red)';
            boxAlarma.style.borderLeftColor = 'var(--red)';
        } else if (data.acceso) {
            valAlarma.textContent = 'ACCESO OK';
            valAlarma.style.color = 'var(--green)';
            boxAlarma.style.borderLeftColor = 'var(--green)';
        } else {
            valAlarma.textContent = 'En espera';
            valAlarma.style.color = 'var(--muted)';
            boxAlarma.style.borderLeftColor = 'var(--muted)';
        }

        const valServo = document.getElementById('valServo');
        const boxServo = document.getElementById('boxServo');
        valServo.textContent = data.cerradura || '---';
        valServo.style.color = (data.cerradura === 'CERRADA') ? '#818cf8' : '#38bdf8';
        boxServo.style.borderLeftColor = (data.cerradura === 'CERRADA') ? '#818cf8' : '#38bdf8';

        const valFallos = document.getElementById('valFallos');
        const boxFallos = document.getElementById('boxFallos');
        valFallos.textContent = data.fallos ?? 0;
        if ((data.fallos ?? 0) > 0) {
            valFallos.style.color = 'var(--yellow)';
            boxFallos.style.borderLeftColor = 'var(--yellow)';
        }
    }

    function enviarComando(cmd) {
        client.publish(TOPIC_CMD, cmd);
        agregarLog(`Enviado: ${cmd}`);
    }

    function cambiarPin() {
        const pin = document.getElementById('nuevoPin').value.trim().toUpperCase();
        if (pin.length !== 4) {
            alert('El PIN debe tener exactamente 4 caracteres (ejemplo: A4B9 o 1234).');
            return;
        }
        enviarComando(`pin:${pin}`);
        document.getElementById('nuevoPin').value = '';
    }
</script>
</body>
</html>
